name: verify

# Windows checks of the YMM4-RTX3060-NVENC source snapshot on this branch, built and run against the YMM4
# binaries from this repository's release. GitHub-hosted runners have no NVIDIA GPU: NVENC encoding is not
# tested here; Direct2D runs on the runner's basic/WARP adapter.
on:
  push:
    branches: ['ci/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      YMM4_DIR: '${{ github.workspace }}\ymm4-host\'
      PROBE_VIDEO: '${{ github.workspace }}\probe-video.mp4'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: microsoft/setup-msbuild@v2

      - name: Restore YMM4 host zip from cache
        id: host-cache
        uses: actions/cache@v4
        with:
          path: host-zip
          key: ymm4-host-release-0.1

      - name: Download YMM4 host zip (release 0.1)
        if: steps.host-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 0.1 --repo $env:GITHUB_REPOSITORY --pattern '*.zip' --dir host-zip
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }

      - name: Extract YMM4 host
        run: |
          New-Item -ItemType Directory -Path ymm4-host -Force | Out-Null
          $zip = (Get-ChildItem host-zip -Filter *.zip | Select-Object -First 1).FullName
          tar -xf $zip -C ymm4-host
          if ($LASTEXITCODE -ne 0) { throw 'Extract failed' }
          $dll = Join-Path $env:YMM4_DIR 'YukkuriMovieMaker.dll'
          (Get-Item $dll).VersionInfo | Format-List FileVersion, ProductVersion
          Get-FileHash $dll -Algorithm SHA256 | Format-List Hash

      - name: Environment
        continue-on-error: true
        run: |
          Get-Content CI_SOURCE.txt
          Get-CimInstance Win32_VideoController | Format-List Name, DriverVersion, AdapterCompatibility
          Get-WindowsFeature Server-Media-Foundation | Format-List Name, InstallState
          dotnet --info | Select-Object -First 15

      - name: Media Foundation and test video
        continue-on-error: true
        run: |
          $feature = Get-WindowsFeature Server-Media-Foundation
          if ($feature -and -not $feature.Installed) { Install-WindowsFeature Server-Media-Foundation | Format-List }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress | Select-Object -Last 3 }
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + $env:Path
          ffmpeg -v error -f lavfi -i testsrc=size=320x180:rate=30 -t 2 -c:v libx264 -pix_fmt yuv420p -y $env:PROBE_VIDEO
          if ($LASTEXITCODE -ne 0) { throw 'Test video generation failed' }
          Get-Item $env:PROBE_VIDEO | Format-List Name, Length

      - name: Native build and invariant checks (no GPU needed)
        if: success() || failure()
        run: |
          msbuild NvencNative\NvencNative.vcxproj /t:Build /p:Configuration=Release /p:Platform=x64 /m /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw 'NvencNative build failed' }
          msbuild tests\NativeChecks.vcxproj /t:Build /p:Configuration=Release /p:Platform=x64 /m /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw 'NativeChecks build failed' }
          & tests\bin\Release\NativeChecks.exe
          if ($LASTEXITCODE -ne 0) { throw 'NativeChecks failed' }

      - name: Build plugin against the YMM4 host
        id: plugin
        if: success() || failure()
        run: |
          dotnet build NVEncVideoWriterPlugin\NVEncVideoWriterPlugin.csproj -c Release "-p:YMM4DirPath=$env:YMM4_DIR" --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Plugin build failed' }

      - name: Frame store, time key and preview rect checks
        if: success() || failure()
        run: |
          dotnet run --project tests\StoreChecksHarness\StoreChecks.csproj -c Release --no-launch-profile
          if ($LASTEXITCODE -ne 0) { throw 'StoreChecks failed' }

      - name: Render readiness checks
        if: success() || failure()
        run: |
          dotnet run --project tests\ReadinessChecks\ReadinessChecks.csproj -c Release --no-launch-profile
          if ($LASTEXITCODE -ne 0) { throw 'ReadinessChecks failed' }

      - name: External file lease checks
        if: success() || failure()
        run: |
          dotnet run --project tests\FileLeaseChecks\FileLeaseChecks.csproj -c Release --no-launch-profile
          if ($LASTEXITCODE -ne 0) { throw 'FileLeaseChecks failed' }

      - name: Cache dependency checks (real host)
        if: success() || failure()
        run: |
          dotnet run --project tests\CacheChecks\CacheChecks.csproj -c Release "-p:YMM4DirPath=$env:YMM4_DIR" --no-launch-profile -- $env:YMM4_DIR
          if ($LASTEXITCODE -ne 0) { throw 'CacheChecks failed' }

      - name: Host hooks, pixel parity, preview rects and decode failure (real host, WARP)
        if: success() || failure()
        run: |
          $video = @()
          if (Test-Path $env:PROBE_VIDEO) { $video = @('--video', $env:PROBE_VIDEO) }
          dotnet run --project tests\HostCacheProbe\HostCacheProbe.csproj -c Release "-p:YMM4DirPath=$env:YMM4_DIR" --no-launch-profile -- $env:YMM4_DIR --gpu @video
          if ($LASTEXITCODE -ne 0) { throw 'HostCacheProbe failed' }
