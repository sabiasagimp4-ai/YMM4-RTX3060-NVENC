name: host-versions

# Compares the code of published YMM4 Lite versions with build-independent fingerprints (tools/HostFingerprint):
# which host types changed between consecutive versions. Linux only; downloads only YukkuriMovieMaker*.dll of
# each version, through YMM4's own update protocol (tools/ci/fetch-ymm4.sh), into the Actions cache.
on:
  push:
    branches: ['ci/host-versions']
  workflow_dispatch:
    inputs:
      count:
        description: 'How many of the newest versions to compare'
        default: '6'
      types:
        description: 'Space-separated host types to report member by member'
        default: ''

permissions:
  contents: read

jobs:
  fingerprints:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      COUNT: ${{ inputs.count || '8' }}
      TYPES: ${{ inputs.types || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version list
        id: list
        run: |
          tools/ci/fetch-ymm4.sh list | tee versions.txt
          head -n "$COUNT" versions.txt | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n > selected.txt
          echo "key=$(sha256sum selected.txt | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: hosts
          key: ymm4-dlls-${{ steps.list.outputs.key }}
          restore-keys: ymm4-dlls-

      - name: Download host assemblies
        run: |
          while read -r v; do tools/ci/fetch-ymm4.sh "$v" "hosts/$v" --dlls; done < selected.txt

      - name: Read build (release 0.1 of this repository, if any)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 0.1 --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --dir release-zip
          mkdir -p hosts/release
          unzip -q -j -o release-zip/*.zip 'YukkuriMovieMaker*.dll' -d hosts/release
          ls hosts/release | head -30
          tools/ci/fetch-ymm4.sh 4.56.1.0 hosts/4.56.1.0-updater --dlls || echo "4.56.1.0 is not on the update server"

      - name: Fingerprints
        run: |
          dotnet build tools/HostFingerprint -c Release --nologo -v q
          tool=tools/HostFingerprint/bin/Release/net10.0/HostFingerprintTool.dll
          mkdir -p reports
          while read -r v; do dotnet $tool report "hosts/$v" > "reports/$v.tsv"; done < selected.txt
          prev=
          while read -r v; do
            if [ -n "$prev" ]; then
              echo "################ $prev -> $v"
              dotnet $tool diff "reports/$prev.tsv" "reports/$v.tsv"
              if [ -n "$TYPES" ]; then dotnet $tool members "hosts/$prev" "hosts/$v" $TYPES; fi
            fi
            prev=$v
          done < selected.txt
          echo "################ contracts: each version against the previous one"
          prev=
          while read -r v; do
            if [ -n "$prev" ]; then echo "== $prev -> $v"; dotnet $tool compare "hosts/$prev" "hosts/$v"; fi
            prev=$v
          done < selected.txt
          if [ -d hosts/release ]; then
            echo "################ contracts: release build"
            dotnet $tool contracts hosts/release | grep '^#'
            while read -r v; do echo "== release -> $v"; dotnet $tool compare hosts/release "hosts/$v"; done < selected.txt
            [ -d hosts/4.56.1.0-updater ] && dotnet $tool compare hosts/release hosts/4.56.1.0-updater
            last=$(tail -1 selected.txt); echo "== diff $last -> release"; dotnet $tool report hosts/release > reports/release.tsv; dotnet $tool diff "reports/$last.tsv" reports/release.tsv
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: fingerprints
          path: reports
