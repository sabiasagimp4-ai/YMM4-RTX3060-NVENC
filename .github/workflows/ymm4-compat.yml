name: ymm4-compat

# Which YMM4 Lite versions can this plugin run on, and with which features? Writes the answer into the README
# (between the ymm4-versions markers), docs/YMM4_VERSIONS.md and docs/compat/ymm4-versions.json.
#  1. plan:     the versions YMM4's update server publishes (tools/ci/fetch-ymm4.sh list) and the read builds; by
#               default only those not checked yet (a new YMM4 version). "stale" also re-checks the versions checked
#               with an older plugin version (after a release), "all" every version.
#  2. package:  the plugin built like a release (against the read YMM4 4.56.1.0, build.ps1; its reference to
#               YukkuriMovieMaker is lowered to the oldest supported YMM4, HostReferenceVersion.targets).
#  3. files:    on Linux, from the files only. Each version's runtime configuration (a few hundred bytes): YMM4 carries
#               its own .NET, and a YMM4 on an older .NET than the plugin's cannot load it. For the others, YMM4's own
#               assemblies, one version after another in one folder, downloading only the files that changed (as
#               YMM4's updater does): the host assemblies the plugin references and their versions (YMM4 does not
#               load a plugin built against a newer YMM4), every YMM4 API it calls, and the HostContracts verdict
#               (tools/HostFingerprint scan).
#  4. check:    on Windows, the versions the files allow: YMM4 started with the plugin installed, where the plugin
#               itself reports what it enabled (tools/compat/start-check.ps1).
#  5. tests:    for a new YMM4 version (or on request), the plugin and the cache checks built like a release (against
#               the read build, with the lowered reference) and run on that version as an unread build.
#  6. publish:  tools/compat/ymm4_compat.py merges and renders; the result is committed to the default branch, and a
#               newly published YMM4 version gets an issue with its result.
# YMM4 is downloaded from its own update server the way its updater does, and kept only in the Actions cache; it is
# never committed. No NVIDIA GPU on the runners: NVENC itself is not run.
on:
  schedule:
    - cron: '17 21 * * *' # 06:17 JST
  workflow_dispatch:
    inputs:
      versions:
        description: 'new (not checked yet), stale (also those checked with an older plugin), all, or versions separated by spaces'
        default: 'new'
      start:
        description: 'Start YMM4 with the plugin on Windows'
        type: boolean
        default: true
      tests:
        description: 'Also build and run the cache checks against each checked version (about 20 minutes each)'
        type: boolean
        default: false
      publish:
        description: 'Commit the results to the default branch'
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: ymm4-compat-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DATA: docs/compat/ymm4-versions.json

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      any: ${{ steps.plan.outputs.any }}
      targets: ${{ steps.plan.outputs.targets }}
      plugin: ${{ steps.plan.outputs.plugin }}
      newest: ${{ steps.plan.outputs.newest }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          MODE: ${{ inputs.versions || 'new' }}
        run: |
          tools/ci/fetch-ymm4.sh list > server.txt
          echo "$(wc -l < server.txt) versions on the update server"
          echo "newest=$(head -1 server.txt)" >> "$GITHUB_OUTPUT"
          # The read builds are checked too, also one the update server does not list.
          grep -o 'new("[0-9.]*",' NVEncVideoWriterPlugin/HostKnownBuilds.cs | grep -o '[0-9][0-9.]*[0-9]' >> server.txt
          plugin=$(sed -n 's:.*<InformationalVersion>\(.*\)</InformationalVersion>.*:\1:p' NVEncVideoWriterPlugin/NVEncVideoWriterPlugin.csproj)
          # Only the commit of the release tag is that release; any other commit is a development build after it.
          tagged=$(git ls-remote --tags origin | awk -v t="refs/tags/v$plugin" '$2 == t || $2 == t "^{}" {print $1}')
          printf '%s\n' $tagged | grep -qx "$GITHUB_SHA" || plugin="$plugin+${GITHUB_SHA::7}"
          python3 tools/compat/ymm4_compat.py plan "$DATA" server.txt --plugin "$plugin" --mode $MODE > targets.txt
          echo "$(wc -l < targets.txt) to check with plugin $plugin:"; cat targets.txt
          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
          echo "any=$([ -s targets.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "targets=$(tr '\n' ' ' < targets.txt)" >> "$GITHUB_OUTPUT"

  reference:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: host
          key: cache-dev-ymm4-4.56.1.0-top
      - if: steps.cache.outputs.cache-hit != 'true'
        run: bash tools/ci/fetch-ymm4.sh 4.56.1.0 host --top
      - uses: actions/upload-artifact@v4
        with:
          name: reference-host
          path: host
          retention-days: 1

  package:
    needs: reference
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: reference-host
          path: host
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build like a release
        run: |
          ./build.ps1 -Ymm4DirPath "$env:GITHUB_WORKSPACE\host"
          if (-not (Test-Path dist/YMM4-RTX3060-NVENC.ymme)) { throw 'No package was built' }
          Copy-Item dist/YMM4-RTX3060-NVENC.ymme plugin.zip
          Expand-Archive plugin.zip -DestinationPath plugin
          Get-ChildItem plugin
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: plugin
          retention-days: 3

  files:
    needs: [plan, package]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
      loadable: ${{ steps.groups.outputs.loadable }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: plugin
          path: plugin
      - uses: actions/cache@v4
        with:
          path: assemblies
          key: ymm4-scan-${{ github.run_id }}
          restore-keys: ymm4-scan-
      - name: Files of each version
        env:
          TARGETS: ${{ needs.plan.outputs.targets }}
          YMM4_FETCH_PRUNE: '1'
        run: |
          dotnet build tools/HostFingerprint -c Release --nologo -v q
          tool=tools/HostFingerprint/bin/Release/net10.0/HostFingerprintTool.dll
          mkdir -p results
          scan() { dotnet "$tool" scan "$1" plugin > "results/$v.scan.json" || echo '{"error":"scan failed"}' > "results/$v.scan.json"; }
          # Oldest first: each version then downloads only what changed since the one before.
          for v in $(printf '%s\n' $TARGETS | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n); do
            if ! tools/ci/fetch-ymm4.sh "$v" "rc/$v" --match '^YukkuriMovieMaker\.runtimeconfig\.json$' > /dev/null; then
              echo '{"error":"download failed"}' > "results/$v.scan.json"
            else
              scan "rc/$v"
              if python3 tools/compat/ymm4_compat.py runtime-ok "results/$v.scan.json"; then
                if tools/ci/fetch-ymm4.sh "$v" assemblies --scan > /dev/null; then
                  scan assemblies
                else
                  echo '{"error":"download failed"}' > "results/$v.scan.json"
                fi
              fi
            fi
            python3 - "$v" "results/$v.scan.json" <<'PY'
          import json, sys
          s = json.load(open(sys.argv[2]))
          p = s.get('plugin') or {}
          old = [f"{r['name']} {r['host']}<{r['required']}" for r in p.get('references') or [] if r.get('host') and tuple(map(int, r['host'].split('.'))) < tuple(map(int, r['required'].split('.')))]
          print(sys.argv[1], s.get('error') or '', (s.get('runtime') or {}).get('tfm'), 'read:', s.get('knownBuild'),
                'basis:', (s.get('contracts') or {}).get('baseline'), 'older refs:', old, 'missing APIs:', len(p.get('apiMissing') or []))
          for line in (p.get('apiMissing') or [])[:60]: print('   missing:', line)
          sys.path.insert(0, 'tools/compat'); import ymm4_compat
          print('   unguarded:', len(ymm4_compat.unguarded(p.get('apiMissing') or [])))
          PY
          done
          python3 tools/compat/ymm4_compat.py loadable results > loadable.txt
      - id: groups
        run: |
          # Oldest first, in up to two groups, each started in one folder.
          sort -t. -k1,1n -k2,2n -k3,3n -k4,4n loadable.txt > ascending.txt
          echo 'Versions to start:'; cat ascending.txt
          echo "loadable=$(jq -Rsc 'split("\n") | map(select(length > 0))' ascending.txt)" >> "$GITHUB_OUTPUT"
          echo "groups=$(jq -Rsc 'split("\n") | map(select(length > 0)) as $v | ($v | length) as $n
            | if $n == 0 then [] else (($n + 1) / 2 | floor) as $size | [range(0; $n; $size) as $i | $v[$i:$i + $size] | join(" ")] end' ascending.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: results-files
          path: results

  check:
    needs: [files, package]
    if: needs.files.outputs.groups != '[]' && needs.files.outputs.groups != ''
    runs-on: windows-2022
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 2 # the update server is one person's: keep the load near that of two updating users
      matrix:
        group: ${{ fromJSON(needs.files.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: plugin
          path: plugin
      - uses: actions/cache@v4
        with:
          path: app
          key: ymm4-app-${{ github.run_id }}-${{ strategy.job-index }}
          restore-keys: ymm4-app-
      - name: Start each version
        if: github.event_name != 'workflow_dispatch' || inputs.start
        shell: pwsh
        env:
          GROUP: ${{ matrix.group }}
          YMM4_FETCH_PRUNE: '1'
        run: |
          $bash = Join-Path $env:ProgramFiles 'Git\bin\bash.exe'
          New-Item -ItemType Directory -Path results -Force | Out-Null
          foreach ($v in -split $env:GROUP) {
            Write-Output "::group::YMM4 $v"
            & $bash tools/ci/fetch-ymm4.sh $v app --app
            if ($LASTEXITCODE -ne 0) {
              [IO.File]::WriteAllText("$PWD\results\$v.start.json", '{"error":"download failed"}')
            } else {
              powershell -NoProfile -ExecutionPolicy Bypass -File tools\compat\start-check.ps1 -HostDir "$PWD\app" -PluginDir "$PWD\plugin" -Out "$PWD\results\$v.start.json"
            }
            Write-Output '::endgroup::'
          }
          exit 0 # a version that could not be checked is recorded as such, not as a failed job
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-check-${{ strategy.job-index }}
          path: results

  tests:
    needs: [plan, files, reference]
    if: needs.files.outputs.loadable != '[]' && needs.files.outputs.loadable != '' && (inputs.tests || (github.event_name == 'schedule' && contains(fromJSON(needs.files.outputs.loadable), needs.plan.outputs.newest)))
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        version: ${{ fromJSON(inputs.tests && needs.files.outputs.loadable || format('["{0}"]', needs.plan.outputs.newest)) }}
    env:
      YMM4_DIR: '${{ github.workspace }}\app\'
      REFERENCE_DIR: '${{ github.workspace }}\host\'
      PROBE_VIDEO: '${{ github.workspace }}\probe-video.mp4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: reference-host
          path: host
      - uses: actions/cache@v4
        with:
          path: app
          key: ymm4-app-tests-${{ github.run_id }}-${{ strategy.job-index }}
          restore-keys: ymm4-app-
      - name: YMM4 ${{ matrix.version }}
        shell: bash
        env:
          YMM4_FETCH_PRUNE: '1'
        run: tools/ci/fetch-ymm4.sh "${{ matrix.version }}" app --app
      - name: Media Foundation and test video
        continue-on-error: true
        run: |
          $feature = Get-WindowsFeature Server-Media-Foundation
          if ($feature -and -not $feature.Installed) { Install-WindowsFeature Server-Media-Foundation | Out-Null }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress | Select-Object -Last 1 }
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + $env:Path
          ffmpeg -v error -f lavfi -i testsrc=size=320x180:rate=30 -t 2 -c:v libx264 -pix_fmt yuv420p -y $env:PROBE_VIDEO
      - name: Build the plugin like a release
        id: build
        continue-on-error: true
        run: |
          dotnet build NVEncVideoWriterPlugin\NVEncVideoWriterPlugin.csproj -c Release "-p:YMM4DirPath=$env:REFERENCE_DIR" --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Plugin build failed' }
      - name: Cache key checks (real host)
        id: keys
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          dotnet run --project tests\CacheChecks\CacheChecks.csproj -c Release "-p:YMM4DirPath=$env:REFERENCE_DIR" --no-launch-profile -- $env:YMM4_DIR
          if ($LASTEXITCODE -ne 0) { throw 'CacheChecks failed' }
      - name: Export hook and cache checks as an unread build (real host, WARP)
        id: probe
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          $video = @()
          if (Test-Path $env:PROBE_VIDEO) { $video = @('--video', $env:PROBE_VIDEO) }
          dotnet run --project tests\HostCacheProbe\HostCacheProbe.csproj -c Release "-p:YMM4DirPath=$env:REFERENCE_DIR" --no-launch-profile -- $env:YMM4_DIR --unread --gpu @video
          if ($LASTEXITCODE -ne 0) { throw 'HostCacheProbe --unread failed' }
      - name: Record
        if: always()
        run: |
          New-Item -ItemType Directory -Path results -Force | Out-Null
          $result = @{ build = '${{ steps.build.outcome }}'; keys = '${{ steps.keys.outcome }}'; probe = '${{ steps.probe.outcome }}' } | ConvertTo-Json -Compress
          [IO.File]::WriteAllText("$PWD\results\${{ matrix.version }}.tests.json", $result)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-tests-${{ matrix.version }}
          path: results

  publish:
    needs: [plan, files, check, tests]
    if: always() && needs.plan.outputs.any == 'true' && needs.files.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: results-files
          path: results
      - uses: actions/download-artifact@v4
        with:
          pattern: results-[ct]*
          merge-multiple: true
          path: results
      - name: Merge and render
        env:
          PLUGIN: ${{ needs.plan.outputs.plugin }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ls results
          before=$( (jq -r '.versions // {} | keys[]' "$DATA" 2>/dev/null || true) | sort -t. -k1,1nr -k2,2nr -k3,3nr -k4,4nr | head -1)
          echo "before=$before" >> "$GITHUB_ENV"
          python3 tools/compat/ymm4_compat.py merge results "$DATA" --plugin "$PLUGIN" --commit "$GITHUB_SHA" --run "$RUN_URL"
          python3 tools/compat/ymm4_compat.py render "$DATA" README.md docs/YMM4_VERSIONS.md
          git diff --stat
          sed -n '/ymm4-versions:begin/,/ymm4-versions:end/p' README.md | tee -a "$GITHUB_STEP_SUMMARY"
          sed -n '/^## 結果/,/^## 実行記録/p' docs/YMM4_VERSIONS.md
      - uses: actions/upload-artifact@v4
        with:
          name: rendered
          path: |
            README.md
            docs/YMM4_VERSIONS.md
            docs/compat/ymm4-versions.json
      - name: Commit
        if: github.ref_name == github.event.repository.default_branch && (github.event_name != 'workflow_dispatch' || inputs.publish)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/YMM4_VERSIONS.md "$DATA"
          if git diff --cached --quiet; then echo 'No change.'; exit 0; fi
          git commit -m "docs(compat): YMM4 version check results [skip ci]" -m "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          for i in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Issue for a newly published YMM4 version
        if: github.ref_name == github.event.repository.default_branch && env.before != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NEWEST: ${{ needs.plan.outputs.newest }}
        run: |
          # Only a version newer than every version checked before (never the first bulk check of old versions).
          [ "$NEWEST" != "$before" ] && [ "$(printf '%s\n%s\n' "$before" "$NEWEST" | sort -t. -k1,1nr -k2,2nr -k3,3nr -k4,4nr | head -1)" = "$NEWEST" ] || exit 0
          jq -e --arg v "$NEWEST" '.versions[$v]' "$DATA" > /dev/null || exit 0
          [ "$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "\"YMM4 $NEWEST の確認結果\" in:title" --json number --jq length)" = "0" ] || exit 0
          python3 tools/compat/ymm4_compat.py issue "$DATA" "$NEWEST" > issue.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "YMM4 $NEWEST の確認結果" --body-file issue.md
